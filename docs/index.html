<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f1650">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sterke Beer</title>
<style>
:root{
  --sky1:#bfe6ff; --sky2:#fff4d9; --ink:#2d2346; --soft:#6b6385;
  --orange:#ff8a3d; --orange2:#e86f1f; --green:#2fbf71; --green2:#22a05c;
  --red:#ff6b6b; --purple:#7c5cff; --purple2:#5f41e0; --yellow:#ffd23f;
  --brown:#8b5a2b; --card:#ffffff; --shadow:0 6px 0 rgba(45,35,70,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Nunito","Varela Round","Comic Sans MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));
}
#app{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:780px;margin:0 auto;padding:18px 18px 40px;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{margin:.2em 0;font-weight:900;letter-spacing:.2px}
h1{font-size:clamp(30px,6vw,46px)} h2{font-size:clamp(24px,4.6vw,34px)} h3{font-size:22px}
p{font-size:20px;line-height:1.45;margin:.4em 0}
.center{text-align:center}
.grow{flex:1}
button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-size:22px;font-weight:900;padding:16px 26px;border-radius:22px;
  background:var(--orange);color:#fff;box-shadow:0 6px 0 var(--orange2);
  transition:transform .08s, box-shadow .08s;min-height:64px
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--orange2)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green2)}
.btn.purple{background:var(--purple);box-shadow:0 6px 0 var(--purple2)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 6px 0 #d8d2ea}
.btn.small{font-size:18px;padding:10px 16px;min-height:50px;border-radius:16px}
.btn.big{font-size:28px;padding:20px 36px;min-height:80px}
.btn.block{display:flex;width:100%}
.card{background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.mt{margin-top:18px}.mt2{margin-top:30px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:20px;box-shadow:0 4px 0 rgba(45,35,70,.12);display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:60px;height:60px;border-radius:20px;background:#fff;font-size:30px;box-shadow:0 5px 0 #d8d2ea;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d8d2ea}

/* intro */
.hero{font-size:150px;line-height:1;animation:bob 2.4s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
input.name{font-family:inherit;font-size:30px;font-weight:900;text-align:center;padding:16px;border-radius:20px;border:4px solid #e5def7;width:100%;max-width:420px;color:var(--ink);user-select:text;-webkit-user-select:text}
input.name:focus{outline:none;border-color:var(--purple)}

/* map */
.status{display:flex;align-items:center;gap:14px;background:#fff;border-radius:26px;padding:12px 16px;box-shadow:var(--shadow)}
.avatar{font-size:58px;position:relative;line-height:1}
.avatar .acc{position:absolute;right:-10px;top:-10px;font-size:30px}
.xpbar{height:16px;background:#efeaf9;border-radius:99px;overflow:hidden;margin-top:6px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:99px;transition:width .6s}
.path{position:relative;padding:20px 0 60px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:150px;margin:0 auto 14px}
.node .dot{
  width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:46px;background:#fff;box-shadow:0 7px 0 #cfc6e8;position:relative
}
.node.done .dot{background:#fff6d6;box-shadow:0 7px 0 #f0c94a}
.node.open .dot{background:var(--orange);box-shadow:0 7px 0 var(--orange2);animation:pulse 1.6s infinite}
.node.locked .dot{background:#e9e5f3;box-shadow:0 7px 0 #cfc6e8;filter:grayscale(1);opacity:.75}
.node .num{position:absolute;top:-6px;left:-6px;background:var(--purple);color:#fff;font-weight:900;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px}
.node .lbl{font-weight:900;font-size:16px;text-align:center;margin-top:10px;background:rgba(255,255,255,.8);border-radius:12px;padding:3px 10px}
.node .stars{font-size:18px;letter-spacing:1px;height:22px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.moon{background:#2d2346;color:#fff;border-radius:22px;padding:14px 18px;font-weight:800;font-size:18px;text-align:center}

/* activity */
.prog{flex:1;height:18px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.mascot{font-size:110px;line-height:1;text-align:center}
.bubble{position:relative;background:#fff;border-radius:28px;padding:22px 24px;font-size:23px;line-height:1.45;box-shadow:var(--shadow);margin-top:16px}
.bubble:before{content:"";position:absolute;top:-18px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom:18px solid #fff;border-top:0}
.trio{display:flex;gap:10px;margin-top:6px}
.trio span{flex:1;background:#f6f3ff;border-radius:18px;padding:12px 6px;text-align:center;font-size:17px;line-height:1.3}
.trio span:first-line{font-size:44px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chips span{background:#eaf8ff;border-radius:999px;padding:8px 16px;font-weight:900}
.sit{font-size:25px;font-weight:800;line-height:1.35}
.sitemoji{font-size:70px;text-align:center;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.opt{
  background:#fff;border-radius:22px;padding:16px 18px;font-size:21px;font-weight:800;text-align:left;
  box-shadow:0 6px 0 #d8d2ea;color:var(--ink);display:flex;gap:12px;align-items:center;min-height:70px;line-height:1.3
}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #d8d2ea}
.opt .ic{font-size:36px}
.opt.right{background:#d9f7e6;box-shadow:0 6px 0 var(--green)}
.opt.wrong{background:#ffe1e1;box-shadow:0 6px 0 var(--red)}
.opt.dim{opacity:.45}
.timer{height:14px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin-top:12px}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));border-radius:99px}
.fb{border-radius:24px;padding:18px 20px;font-size:21px;line-height:1.4;margin-top:16px;animation:pop .3s}
.fb.good{background:#d9f7e6}.fb.bad{background:#fff0d9}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.combo{font-weight:900;font-size:22px;color:var(--orange2)}
.fox{display:flex;gap:14px;align-items:flex-start}
.fox .who{font-size:80px;line-height:1}
.fox .say{background:#fff;border-radius:24px;padding:18px 20px;font-size:25px;font-weight:900;box-shadow:var(--shadow);flex:1;position:relative}

/* zin */
.sentence{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;background:rgba(255,255,255,.6);border:3px dashed #c9bfe6;border-radius:20px;padding:12px;font-size:24px;font-weight:900;align-items:center}
.sentence span{background:var(--green);color:#fff;border-radius:14px;padding:6px 14px;animation:pop .3s}
.bigsay{font-size:clamp(30px,6vw,44px);font-weight:900;text-align:center;line-height:1.25;margin:16px 0}

/* adem */
.balloonbox{height:330px;display:flex;align-items:center;justify-content:center;position:relative}
.balloon{width:200px;height:240px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#ffb3c7,#ff5d8f 60%,#e23d70);transform:scale(.45);transition:transform 4s ease-in-out;position:relative;box-shadow:inset -14px -18px 0 rgba(0,0,0,.08)}
.balloon:after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:14px solid #e23d70;transform:rotate(180deg)}
.phase{font-size:32px;font-weight:900;text-align:center;min-height:44px}

/* houding & stem */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.step{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 0 #d8d2ea;font-size:19px;font-weight:800;text-align:center;line-height:1.3}
.step .e{font-size:50px;display:block}
.step.on{background:#d9f7e6;box-shadow:0 6px 0 var(--green)}
.bigcount{font-size:140px;font-weight:900;text-align:center;line-height:1;color:var(--purple)}
.voice{border-radius:22px;padding:18px;box-shadow:0 6px 0 #d8d2ea;background:#fff;display:flex;gap:14px;align-items:center;font-weight:900}
.voice .e{font-size:54px}
.voice.on{background:#d9f7e6;box-shadow:0 6px 0 var(--green)}
.v-muis{font-size:15px;color:#9b95ad;font-style:italic}
.v-draak{font-size:30px;color:#e23d3d;animation:shake .5s infinite}
.v-beer{font-size:26px;color:var(--ink)}

/* gedachten */
.arena{position:relative;height:min(62vh,560px);background:linear-gradient(180deg,#d8f0ff,#efe9ff);border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.8)}
.tb{position:absolute;bottom:-120px;border-radius:999px;padding:14px 18px;font-weight:900;font-size:19px;color:#fff;max-width:230px;text-align:center;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.12);animation:rise linear forwards}
.tb.k{background:linear-gradient(180deg,#3fd187,#22a05c)}
.tb.g{background:linear-gradient(180deg,#8d8aa3,#5d5a78)}
.tb.flipped{background:linear-gradient(180deg,#ffd23f,#ff9f1c);color:#3b2a00}
@keyframes rise{to{transform:translateY(calc(-1 * min(62vh,560px) - 160px))}}
.toast{position:absolute;left:12px;right:12px;top:12px;background:#fff;border-radius:18px;padding:12px 16px;font-size:18px;font-weight:800;box-shadow:var(--shadow);z-index:5;animation:pop .25s}
.score{font-size:26px;font-weight:900}

/* resultaat */
.bigstars{font-size:76px;text-align:center;letter-spacing:6px}
.bigstars span{display:inline-block;animation:starIn .5s both}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}80%{transform:scale(1.25)}100%{transform:scale(1)}}
.mission{background:linear-gradient(135deg,#7c5cff,#a58bff);color:#fff;border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--purple2)}
.mission b{font-size:22px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:var(--shadow);font-weight:800;font-size:16px}
.badge .e{font-size:54px;display:block}
.badge.off{filter:grayscale(1);opacity:.45}
.mlist label{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;margin-top:10px;font-size:18px;font-weight:700;box-shadow:0 4px 0 #e2dcf2}
.mlist input{width:30px;height:30px;accent-color:var(--green);flex:none}
.cert{background:#fffaf0;border:10px double #f0c94a;border-radius:30px;padding:30px 20px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:14px auto}
.keypad button{font-size:28px;font-weight:900;height:66px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #d8d2ea;color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(45,35,70,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay .card{max-width:480px;width:100%;text-align:center}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.parent p,.parent li{font-size:18px}
.toggle{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:800}
.toggle input{width:32px;height:32px;accent-color:var(--purple)}
@media (max-width:520px){.steps{grid-template-columns:1fr}.node .dot{width:84px;height:84px;font-size:40px}}

/* ===== Stoere game-look ===== */
:root{--soft:#8f87b5}
body{color:#fff;background:
  radial-gradient(circle at 15% 8%,rgba(124,92,255,.55) 0,transparent 38%),
  radial-gradient(circle at 92% 85%,rgba(0,190,255,.35) 0,transparent 42%),
  linear-gradient(180deg,#120e2e,#1f1650 60%,#14204a)}
h1,h2{color:#fff;text-shadow:0 4px 0 #5f41e0,0 0 22px rgba(124,92,255,.55)}
.logo{letter-spacing:3px;font-style:italic;text-shadow:0 4px 0 #e86f1f,0 0 26px rgba(255,138,61,.6)}
.card,.bubble,.opt,.step,.voice,.badge,.pill,.status,.fox .say,.mlist label,.fb,.node .lbl{color:var(--ink)}
.card h1,.card h2,.card h3,.cert h1{color:var(--ink);text-shadow:none}
.cert h1[style]{color:var(--purple)!important}
.moon{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22)}
.prog,.timer{background:rgba(255,255,255,.14)}
.prog>i{background:linear-gradient(90deg,#2fbf71,#3ae8a0);box-shadow:0 0 12px #3ae8a0}
.sentence{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff}
.arena{background:linear-gradient(180deg,#261c63,#123a66);box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
.bigcount{color:#ffd23f;text-shadow:0 0 30px rgba(255,210,63,.6)}
.node .dot{box-shadow:0 7px 0 #4a3d8a,0 0 0 4px rgba(255,255,255,.08)}
.node.open .dot{box-shadow:0 7px 0 var(--orange2),0 0 28px rgba(255,138,61,.8)}
.node.done .dot{box-shadow:0 7px 0 #f0c94a,0 0 18px rgba(255,210,63,.45)}
.node.locked .dot{background:#3a3170;box-shadow:0 7px 0 #261f52;opacity:.9}
.node .lbl{background:rgba(255,255,255,.92)}
.btn{text-transform:uppercase;letter-spacing:.5px}
.btn.green{box-shadow:0 6px 0 var(--green2),0 0 18px rgba(47,191,113,.45)}
.btn.purple{box-shadow:0 6px 0 var(--purple2),0 0 18px rgba(124,92,255,.5)}
.combo{color:#ffd23f;text-shadow:0 0 12px rgba(255,138,61,.8)}
.mission{box-shadow:0 6px 0 var(--purple2),0 0 24px rgba(124,92,255,.6)}
</style>
</head>

<div id="app"></div>

const RANKS = [[0,"Rookie","🎒"],[7,"Beer-in-training","⭐"],[18,"Stoere Beer","🧢"],[30,"Sterke Beer","💪"],[43,"Beer-Legende","👑"]];

/* ================= STATE ================= */
function fresh(){return {name:"",done:{},maxCombo:0,bestThoughts:0,breaths:0,practice:0,missions:{},streak:0,bestStreak:0,lastDay:"",parent:false};}
let S = (function(){
  try{ const raw = localStorage.getItem(KEY); return raw ? Object.assign(fresh(), JSON.parse(raw)) : fresh(); }
  catch(e){ return fresh(); }
})();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function dayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return dayStr(); }
function touchDay(){
  const t = today(); if(S.lastDay===t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.streak = (S.lastDay===dayStr(y)) ? S.streak+1 : 1;
  S.bestStreak = Math.max(S.bestStreak||0, S.streak);
  S.lastDay = t; save();
}
function totalStars(){ return Object.values(S.done).reduce((a,d)=>a+(d.stars||0),0); }
function doneCount(){ return Object.keys(S.done).length; }
function rankOf(st){ let r=RANKS[0]; for(const x of RANKS) if(st>=x[0]) r=x; return r; }
function nextRank(st){ return RANKS.find(x=>x[0]>st); }
function isUnlocked(i){
  if(i===0 || S.done[i] || S.parent) return true;
  const p = S.done[i-1]; return !!(p && p.date < today());
}
function waitingForTomorrow(i){ const p=S.done[i-1]; return !S.parent && p && p.date===today() && !S.done[i]; }

/* ================= HULP ================= */
const app = document.getElementById("app");
const $ = s => app.querySelector(s);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function nameFill(s){ return s.replace(/\{naam\}/g, esc(S.name||"kanjer")); }
let current = "map";
let timers = [];
function later(fn,ms){ const t=setTimeout(fn,ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function show(html){ clearTimers(); app.innerHTML = html; app.scrollTop = 0; }

// Geluid (WebAudio, geen bestanden nodig)
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} return AC; }
function tone(f,d,type,vol,delay){
  const c=ac(); if(!c) return;
  try{
    const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
const SND = {
  good(){ tone(660,.15,"triangle"); tone(990,.22,"triangle",.18,.1); },
  bad(){ tone(220,.25,"sawtooth",.08); },
  tap(){ tone(520,.07,"sine",.1); },
  pop(){ tone(880,.08,"square",.06); tone(1320,.08,"square",.05,.05); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.25,"triangle",.18,i*.12)); },
  tick(){ tone(1200,.04,"sine",.05); }
};
document.addEventListener("pointerdown", ()=>ac(), {once:true});

function confetti(n){
  const cols=["#ff8a3d","#2fbf71","#7c5cff","#ffd23f","#ff5d8f","#3ab0ff"];
  for(let i=0;i<(n||60);i++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=pick(cols);
    d.style.animationDuration=(2+Math.random()*2)+"s"; d.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),5000);
  }
}
function overlay(html){
  const o=document.createElement("div"); o.className="overlay"; o.innerHTML="<div class='card'>"+html+"</div>";

/* ======== ACTIVITEITEN-RUNNER ======== */
function runActs(acts, onEnd){
  const ctx={ok:0,total:0,combo:0,best:0};
  let k=0;
  function next(){
    if(k>=acts.length) return onEnd(ctx);
    const a=acts[k], idx=k; k++;
    const head = (inner)=>`<div class="wrap"><div class="topbar"><button class="iconbtn" id="x">✕</button>
      <div class="prog"><i style="width:${Math.round(idx/acts.length*100)}%"></i></div></div>${inner}</div>`;
    current="act";
    ACT[a.type](a, ctx, next, head);
    const x=$("#x"); if(x) x.onclick=quitAsk;
  }
  next();
}
function quitAsk(){
  const o=overlay(`<div style="font-size:60px">🐻</div><h3>Stoppen?</h3><p>Je voortgang in dit level gaat verloren.</p>
    <div class="row mt" style="justify-content:center"><button class="btn white" id="no">Doorgaan</button><button class="btn" id="yes">Stoppen</button></div>`);
  o.querySelector("#no").onclick=()=>o.remove();
  o.querySelector("#yes").onclick=()=>{o.remove();showMap();};
}
function bindX(){ const x=$("#x"); if(x) x.onclick=quitAsk; }

const ACT = {

        else if(o==="draak"){ SND.bad(); html=`<div class="fb bad"><b>${s.fd||"🐲 Dat is een Draak-reactie. Dan wordt het ruzie, en krijg jij misschien zelf straf."}</b><br>Beer kiest het groene antwoord: ${s.u}</div>`; }

  /* --- flitsronde met Plaagvos --- */
  flits(a, ctx, done, head){

        later(()=>{ ph.textContent="Blaas uit… fffff"; bl.style.transition="transform 5s ease-in-out"; bl.style.transform="scale(.45)"; tone(294,.3,"sine",.08); },5500);
        later(round,10800);
      };
      round();
    };
  },

  /* --- krachthouding --- */
  houding(a, ctx, done, head){
    const st=[["🦶","Zet je voeten stevig op de grond, een beetje uit elkaar."],["🧍‍♀️","Rug recht, schouders laag en ontspannen."],["👀","Kijk de ander aan (of naar het puntje van de neus)."],["😌","Adem rustig. Gezicht rustig. Jij bent de baas over jezelf."]];
    let on=0;
    show(head(`<h2 class="center">De Beer-houding</h2><p class="center">Sta op! Doe elke stap en tik erop als het lukt.</p>
      <div class="center" style="font-size:80px;transition:transform .3s" id="bb">🐻</div>
      <div class="steps mt">${st.map((s,i)=>`<button class="step" data-i="${i}"><span class="e">${s[0]}</span>${s[1]}</button>`).join("")}</div>
      <div id="fb" class="center mt"></div>`));
    bindX();
    app.querySelectorAll(".step").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("on")) return; b.classList.add("on"); on++; SND.good();
      $("#bb").style.transform=`scale(${1+on*.18})`;
      if(on===4){
        $("#fb").innerHTML=`<p><b>Super! Nu 10 tellen zo blijven staan.</b></p><button class="btn big green" id="cnt">Start de klok ⏱️</button>`;
        $("#cnt").onclick=()=>{
          let c=10;
          show(head(`<div class="grow"></div><p class="center" style="font-size:24px;font-weight:900">Sta als een beer!</p><div class="bigcount" id="c">10</div><div class="mascot">🐻</div><div class="grow"></div>`));
          bindX();
          const tick=()=>{ c--; if(c>0){ $("#c").textContent=c; SND.tick(); later(tick,1000);} else { SND.win(); confetti(40);
            show(head(`<div class="grow"></div><div class="mascot">💪🐻💪</div><h2 class="center">Je staat als een echte beer!</h2><p class="center">Zo sta je ook als iemand vervelend doet. Dan voel je je sterker, en zie je er sterker uit.</p><div class="mt2 center"><button class="btn big green" id="nx">Verder ➜</button></div><div class="grow"></div>`));
            bindX(); $("#nx").onclick=()=>{SND.tap();done();}; } };
          later(tick,1000);
        };
      }
    });
  },

  /* --- beer-stem --- */
  stem(a, ctx, done, head){
    const v=[["muis","🐭","Muis-stem","stop… ik wil dat… eh… niet…","v-muis"],["draak","🐲","Draak-stem","STOP!!! IK WIL DAT NIET!!!","v-draak"],["beer","🐻","Beer-stem","Stop. Ik wil dat niet.","v-beer"]];
    let on=0;
    show(head(`<h2 class="center">Drie stemmen</h2><p class="center">Zeg de zin hardop in <b>alle drie</b> de stemmen. Tik op een kaart als je het gedaan hebt. Lekker gek doen mag!</p>
      <div class="opts">${v.map(x=>`<button class="voice" data-k="${x[0]}"><span class="e">${x[1]}</span><span><span style="font-size:16px;color:var(--soft)">${x[2]}</span><br><span class="${x[4]}">${x[3]}</span></span></button>`).join("")}</div>
      <div id="fb"></div>`));
    bindX();
    app.querySelectorAll(".voice").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("on")) return; b.classList.add("on"); on++; SND.pop();
      if(on===3){
        $("#fb").innerHTML=`<div class="card mt"><h3 class="center">Welke stem werkt het best?</h3><div class="opts">
          ${shuffle(v).map(x=>`<button class="opt" data-k="${x[0]}"><span class="ic">${x[1]}</span>${x[2]}</button>`).join("")}</div><div id="fb2"></div></div>`;
        $("#fb").scrollIntoView({behavior:"smooth",block:"start"});
        let ans=false;
        $("#fb").querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
          if(ans) return; ans=true; ctx.total++;
          if(o.dataset.k==="beer"){ ctx.ok++; SND.good(); o.classList.add("right"); $("#fb2").innerHTML=`<div class="fb good"><b>Ja!</b> De Beer-stem is rustig én stevig. Dan weten ze: jij meent het.</div>`; }
          else { SND.bad(); o.classList.add("wrong"); $("#fb2").innerHTML=`<div class="fb bad">${o.dataset.k==="muis"?"Muis-stem is zo zacht, dan luistert niemand.":"Draak-stem klinkt eng en boos, dan wordt het ruzie."} De <b>Beer-stem</b> werkt het best: rustig én stevig.</div>`; }
          $("#fb2").innerHTML+=`<div class="mt center"><button class="btn green" id="nx">Verder ➜</button></div>`;
          $("#nx").onclick=()=>{SND.tap();done();};
          $("#nx").scrollIntoView({behavior:"smooth",block:"end"});
        });
      }
    });
  },

  /* --- gedachten-bubbels --- */
  gedachten(a, ctx, done, head){
    let score=0, left=a.secs, running=false;
    show(head(`<div class="row between"><span class="score">💚 <span id="sc">0</span> / ${a.target}</span><span class="pill">⏱️ <span id="tl">${a.secs}</span></span></div>
      <div class="arena mt" id="ar"><div class="center" style="padding-top:22%"><p><b>💚 kracht-gedachte = 1 punt<br>🌧️ gemene gedachte omdraaien = 2 punten</b></p><button class="btn big green" id="go">Start! 💭</button></div></div>`));
    bindX();
    const ar=$("#ar");
    $("#go").onclick=()=>{
      ar.innerHTML=""; running=true;
      const spawn=()=>{
        if(!running) return;
        const gem=Math.random()<.42;
        const b=document.createElement("button");
        b.className="tb "+(gem?"g":"k");
        let flip=null;
        if(gem){ const g=pick(GEMEEN); b.textContent="🌧️ "+g[0]; flip=g[1]; } else b.textContent="💚 "+pick(KRACHT);
        const w=ar.clientWidth; b.style.left=Math.max(6,Math.random()*(w-240))+"px";
        const dur=(a.fast?5:6.5)+Math.random()*2; b.style.animationDuration=dur+"s";
        b.onpointerdown=(e)=>{
          e.preventDefault();
          if(b.dataset.used) return; b.dataset.used=1;
          if(gem){ score+=2; SND.good(); b.className="tb flipped"; b.textContent="✨ "+flip; b.style.animationPlayState="paused";
            const t=document.createElement("div"); t.className="toast"; t.innerHTML="🔄 Omgedraaid: <b>"+flip+"</b>"; ar.appendChild(t);
            setTimeout(()=>{t.remove(); b.remove();},1500);
          } else { score+=1; SND.pop(); b.style.transition="transform .2s, opacity .2s"; b.style.opacity="0"; setTimeout(()=>b.remove(),220); }
          $("#sc").textContent=score;
        };
        b.addEventListener("animationend",()=>b.remove());
        ar.appendChild(b);
        later(spawn, (a.fast?750:950)+Math.random()*400);
      };
      spawn();
      const tick=()=>{ left--; const tl=$("#tl"); if(tl) tl.textContent=left;
        if(left<=0){ running=false; end(); } else later(tick,1000); };
      later(tick,1000);
    };
    function end(){
      clearTimers();
      S.bestThoughts=Math.max(S.bestThoughts||0,score); save();
      ctx.total++; ctx.ok += Math.min(1, score/a.target);
      SND.win(); if(score>=a.target) confetti(50);
      show(head(`<div class="grow"></div><div class="mascot">💭</div><h2 class="center">${score} punten!</h2>
        <p class="center">${score>=a.target?"Wauw, jij bent een echte gedachten-vanger!":"Goed geoefend! Hoe vaker je het doet, hoe beter je wordt."}</p>
        <div class="card mt"><p class="center"><b>Onthoud:</b> als je hoofd zegt <i>“Ik kan niks”</i>, zeg jij terug: <b>“Ik kan veel, en de rest leer ik nog!”</b></p></div>
        <div class="mt2 center"><button class="btn big green" id="nx">Verder ➜</button></div><div class="grow"></div>`));
      bindX(); $("#nx").onclick=()=>{SND.tap();done();};
    }
  },

  /* --- zelf oplossen of hulp halen --- */
  sorteer(a, ctx, done, head){
    const pool = a.pool==="houd" ? HOUD : SORT;
    const keys = a.pool==="houd" ? ["vast","mee"] : ["zelf","hulp"];
    const items=shuffle(pool).slice(0,a.n||6); let n=0;
    function draw(){
      const it=items[n];
      show(head(`<div class="card"><div class="sitemoji">${it.e}</div><div class="sit center">${it.t}</div></div>
        <p class="center" style="font-weight:800;color:var(--soft)">${n+1}/${items.length}</p>
        <div class="row" style="gap:14px;align-items:stretch">
          ${keys.map(k=>`<button class="opt" data-a="${k}" style="flex:1;flex-direction:column;text-align:center"><span class="ic" style="font-size:54px">${SORT_LABELS[k].e}</span>${SORT_LABELS[k].t}</button>`).join("")}
        </div><div id="fb"></div>`));
      bindX();
      let ans=false;
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(ans) return; ans=true; ctx.total++;
        const ok=b.dataset.a===it.a;
        app.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.dataset.a===it.a) x.classList.add("right"); else x.classList.add(ok?"dim":"wrong"); });
        if(ok){ ctx.ok++; SND.good(); } else SND.bad();
        $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Goed!":"Net niet."}</b> ${it.u}</div><div class="mt center"><button class="btn green" id="nx">Verder ➜</button></div>`;
        $("#nx").scrollIntoView({behavior:"smooth",block:"end"});
        $("#nx").onclick=()=>{ SND.tap(); n++; if(n<items.length) draw(); else done(); };
      });
    }
    draw();
  }
};

/* ======== EINDE LEVEL ======== */
function levelDone(i, ctx){
  const frac = ctx.total ? ctx.ok/ctx.total : 1;
  const stars = frac>=.85 ? 3 : frac>=.55 ? 2 : 1;
  const before = totalStars(), rankBefore = rankOf(before)[1];
  const prev = S.done[i];
  const first = !prev;
  if(first) S.done[i]={stars, date:today()};
  else if(stars>prev.stars) prev.stars=stars;
  S.maxCombo=Math.max(S.maxCombo||0, ctx.best||0);
  save();
  const gained = totalStars()-before;
  const rankAfter = rankOf(totalStars());
  const L=LEVELS[i], isLast = i===LEVELS.length-1;
  SND.win(); confetti(stars*30);
  current="result";
  show(`<div class="wrap center"><div class="grow"></div>
    <h1>Level ${i+1} gehaald! 🎉</h1>
    <div class="bigstars">${[0,1,2].map(k=>`<span style="animation-delay:${k*.25}s;${k<stars?"":"filter:grayscale(1);opacity:.25"}">⭐</span>`).join("")}</div>
    <p>${stars===3?"Perfect! Jij bent echt een beer! 🐻":stars===2?"Heel goed gedaan! 💪":"Goed geoefend! Speel nog een keer voor meer sterren."}</p>
    ${gained>0?`<p><b>+${gained} ⭐</b></p>`:""}
    ${rankAfter[1]!==rankBefore?`<div class="card mt"><div style="font-size:60px">🐻${rankAfter[2]}</div><h3>Nieuwe rang: ${rankAfter[1]}!</h3></div>`:""}
    ${first?`<div class="mission mt"><div style="font-size:40px">🎯</div><b>Jouw missie in het echt:</b><p style="margin:.3em 0 0">${L.m}</p><p style="font-size:16px;opacity:.9;margin-top:8px">Gedaan? Vink hem aan in je Krachtkast 🏆</p></div>`:""}
    ${first && !isLast?`<div class="moon mt">🌙 Morgen gaat level ${i+2} open!</div>`:""}
    <div class="mt2 row" style="justify-content:center;flex-wrap:wrap">
      ${isLast && first?`<button class="btn purple big" id="cert">📜 Mijn oorkonde</button>`:""}
      <button class="btn big green" id="map">Naar de kaart 🗺️</button></div>
    <div class="grow"></div></div>`);
  $("#map").onclick=()=>{SND.tap();showMap();};
  if($("#cert")) $("#cert").onclick=()=>{SND.tap();showCert();};
}

function showCert(){
  current="cert";
  show(`<div class="wrap center"><div class="topbar"><button class="iconbtn" id="x">✕</button><span></span><span style="width:60px"></span></div>
    <div class="grow"></div>
    <div class="cert"><div style="font-size:90px">👑🐻</div>
      <h1>Oorkonde</h1><p>Hierbij verklaren wij dat</p><h1 style="color:var(--purple)">${esc(S.name)}</h1>
      <p>een echte <b>Beer-Legende</b> is!</p>
      <p>Ze staat stevig, praat met een beer-stem, draait gemene gedachten om, reageert snel op plaaggeesten, kan geven en nemen, en weet wanneer ze hulp haalt.</p>
      <p style="font-size:17px;color:var(--soft)">${new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})}</p></div>
    <div class="grow"></div></div>`);
  confetti(80); SND.win();
  $("#x").onclick=showMap;
}

/* ======== OEFENEN ======== */
function practice(){
  const acts=[{type:"kies", items:"random3", timer:12},{type:"flits", rounds:6, time:7}];
  runActs(acts, ctx=>{
    S.practice=(S.practice||0)+1; S.maxCombo=Math.max(S.maxCombo||0,ctx.best||0); save();
    SND.win(); confetti(30);
    show(`<div class="wrap center"><div class="grow"></div><div class="hero">🦊</div><h1>Training klaar!</h1>
      <p>Je had er <b>${ctx.ok} van de ${ctx.total}</b> goed${ctx.best>2?" en een reeks van 🔥 "+ctx.best:""}.</p>
      <div class="mt2 row" style="justify-content:center;flex-wrap:wrap"><button class="btn big purple" id="again">Nog een keer 🔁</button><button class="btn big green" id="map">Naar de kaart 🗺️</button></div>
      <div class="grow"></div></div>`);
    $("#again").onclick=()=>{SND.tap();practice();};
    $("#map").onclick=()=>{SND.tap();showMap();};
  });
}

/* ======== KRACHTKAST (badges + missies) ======== */
function showKast(){
  current="kast";
  const dc=doneCount(), any3=Object.values(S.done).some(d=>d.stars===3), mDone=Object.values(S.missions).filter(Boolean).length;
  const B=[
    ["🐾","Eerste stap","Speel je eerste level",dc>=1],
    ["⭐","Drie sterren","Haal 3 sterren in een level",any3],
    ["⚡","Bliksemsnel","5 goed op rij bij Plaagvos",(S.maxCombo||0)>=5],
    ["💭","Gedachten-vanger","Haal 14 punten bij de bubbels",(S.bestThoughts||0)>=14],
    ["🎈","Ademmeester","Doe 3 keer ballon-adem",(S.breaths||0)>=3],
    ["🎯","Oefenaar","Train 5 keer met Plaagvos",(S.practice||0)>=5],
    ["📅","Volhouder","3 dagen op rij gespeeld",(S.bestStreak||0)>=3],
    ["✅","Missie-held","Doe 5 missies in het echt",mDone>=5],
    ["🛡️","Halverwege","Haal 7 levels",dc>=7],
    ["👑","Beer-Legende","Haal alle levels",dc>=LEVELS.length]
  ];
  const ms=LEVELS.map((L,i)=>S.done[i]?`<label><input type="checkbox" data-i="${i}" ${S.missions[i]?"checked":""}> <span>${L.m}</span></label>`:"").join("");
  show(`<div class="wrap"><div class="topbar"><button class="iconbtn" id="x">✕</button><h2 style="margin:0">🏆 Krachtkast</h2><span style="width:60px"></span></div>
    <div class="badges">${B.map(b=>`<div class="badge ${b[3]?"":"off"}"><span class="e">${b[0]}</span>${b[1]}<div style="font-size:13px;color:var(--soft);font-weight:700">${b[2]}</div></div>`).join("")}</div>
    <h2 class="mt2">🎯 Mijn missies</h2>
    <div class="mlist">${ms||"<p>Speel een level om je eerste missie te krijgen!</p>"}</div>
    ${dc===LEVELS.length?`<div class="center mt2"><button class="btn purple" id="cert">📜 Mijn oorkonde</button></div>`:""}
  </div>`);
  $("#x").onclick=()=>{SND.tap();showMap();};
  if($("#cert")) $("#cert").onclick=showCert;
  app.querySelectorAll(".mlist input").forEach(c=>c.onchange=()=>{ S.missions[c.dataset.i]=c.checked; save(); if(c.checked){SND.good();confetti(20);} });
}

/* ======== OUDERS ======== */
function parentGate(){
  const a=3+Math.floor(Math.random()*7), b=6+Math.floor(Math.random()*4);
  let typed="";
  current="gate";
  show(`<div class="wrap center"><div class="topbar"><button class="iconbtn" id="x">✕</button><h2 style="margin:0">Voor ouders</h2><span style="width:60px"></span></div>
    <div class="grow"></div><p>Hoeveel is <b>${a} × ${b}</b>?</p><div class="bigsay" id="ty">&nbsp;</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"OK"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div><div class="grow"></div></div>`);
  $("#x").onclick=showMap;
  app.querySelectorAll(".keypad button").forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.k;
    if(k==="⌫") typed=typed.slice(0,-1);
    else if(k==="OK"){ if(+typed===a*b) return showParents(); typed=""; SND.bad(); $("#ty").classList.add("shake"); setTimeout(()=>$("#ty")&&$("#ty").classList.remove("shake"),450); }
    else if(typed.length<3) typed+=k;
    $("#ty").innerHTML=typed||"&nbsp;";
  });
}
function showParents(){
  current="parents";
  show(`<div class="wrap parent"><div class="topbar"><button class="iconbtn" id="x">✕</button><h2 style="margin:0">Ouderhoek</h2><span style="width:60px"></span></div>
    <div class="card"><h3>Hoe werkt het?</h3>
      <p>Er zijn ${LEVELS.length} levels. Elke dag gaat er <b>één nieuw level</b> open (zodra het vorige gehaald is), zodat je kind in kleine stapjes oefent. Gespeelde levels kunnen altijd opnieuw.</p>
      <p>Het spel gebruikt drie figuren: <b>🐭 Muis</b> (te klein, slikt alles), <b>🐲 Draak</b> (te boos, slaat terug) en <b>🐻 Beer</b> (stevig, rustig, duidelijk). Dit sluit aan bij hoe veel weerbaarheidstrainingen werken.</p>
      <ul><li>Houding en stem (stevig staan, korte zinnen)</li><li>De Stop-hand en grenzen aangeven</li><li>Snel reageren met korte zinnen en de “mistbank” (“Kan zijn.”)</li><li>Negatieve gedachten omdraaien</li><li>Verschil tussen zelf oplossen en hulp halen (hulp vragen ≠ klikken)</li><li>Pestkoppen een “saaie” reactie geven: Stop – Zeg – Ga</li><li>Opkomen voor een ander en veilig online</li><li>Geven en nemen: niet altijd je zin doordrijven, en weten wanneer je vasthoudt en wanneer je meegeeft</li></ul>
      <p>Elk level eindigt met een <b>missie in het echt</b>. Doe die samen: oefenen met een ouder (rollenspel!) maakt het meeste verschil.</p>
      <p style="color:var(--soft)">Dit spel is een speelse aanvulling, geen vervanging van een echte weerbaarheidstraining of hulp van school als er sprake is van pesten.</p></div>
    <div class="card mt">
      <label class="toggle"><input type="checkbox" id="pm" ${S.parent?"checked":""}> Alle levels openzetten (niet wachten tot morgen)</label>
      <div class="row mt" style="flex-wrap:wrap">
        <button class="btn white small" id="nm">✏️ Naam wijzigen</button>
        <button class="btn small" id="rs" style="background:var(--red);box-shadow:0 6px 0 #d94b4b">🗑️ Opnieuw beginnen</button>
      </div></div></div>`);
  $("#x").onclick=showMap;
  $("#pm").onchange=e=>{ S.parent=e.target.checked; save(); };
  $("#nm").onclick=()=>{ const o=overlay(`<h3>Nieuwe naam</h3><input class="name" id="nn" maxlength="16" value="${esc(S.name)}"><div class="row mt" style="justify-content:center"><button class="btn white" id="c">Annuleer</button><button class="btn green" id="s">Opslaan</button></div>`);
    o.querySelector("#c").onclick=()=>o.remove();
    o.querySelector("#s").onclick=()=>{ const v=o.querySelector("#nn").value.trim(); if(v){S.name=v;save();} o.remove(); }; };
  $("#rs").onclick=()=>{ const o=overlay(`<div style="font-size:60px">⚠️</div><h3>Alles wissen?</h3><p>Alle sterren, levels en missies gaan weg.</p><div class="row mt" style="justify-content:center"><button class="btn white" id="c">Nee</button><button class="btn" id="s" style="background:var(--red);box-shadow:0 6px 0 #d94b4b">Ja, wissen</button></div>`);
    o.querySelector("#c").onclick=()=>o.remove();
    o.querySelector("#s").onclick=()=>{ S=fresh(); save(); o.remove(); start(); }; };
}

window.onAndroidBack = function(){
  if(document.querySelector(".overlay")){ closeOverlays(); return true; }
  if(current==="map" || current==="welcome") return false;
  if(current==="act"){ quitAsk(); return true; }
  showMap(); return true;
};

start();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
