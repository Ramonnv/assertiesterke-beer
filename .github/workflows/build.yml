name: Bouw Sterke Beer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bouw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Blender bouwt de 3D-modellen en rendert portretten en iconen
  modellen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Blender installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 > /dev/null
          curl -sSL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          echo "$PWD/blender-4.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Recepten controleren
        run: node tools/recipes.mjs > /tmp/models.json && cmp -s /tmp/models.json web/assets/models.json || cp /tmp/models.json web/assets/models.json
      - name: Modellen bouwen en renderen (Blender CLI)
        env:
          SB_SAMPLES: "96"
          SB_RES: "384"
        run: blender -b --factory-startup -P blender/build_assets.py -- web/assets/models.json web/assets
      - name: Lettertype ophalen
        run: python3 tools/get_font.py web/fonts || echo "lettertype overgeslagen"
      - name: Overzicht
        run: ls -la web/assets/models web/assets/portraits web/assets/icons
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web
            !web/dev-*.html

  # 1b. Blender maakt het 3D-printbare poppetje met klik-accessoires
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 > /dev/null
          curl -sSL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          echo "$PWD/blender-4.2.3-linux-x64" >> "$GITHUB_PATH"
      - name: Printbestanden maken (Blender CLI)
        env:
          SB_SAMPLES: "64"
        run: |
          node tools/recipes.mjs > web/assets/models.json
          mkdir -p print
          blender -b --factory-startup -P blender/build_print.py -- web/assets/models.json print
      - name: Inpakken
        run: |
          cp tools/PRINTEN.md print/LEESMIJ-PRINTEN.md
          cd print && zip -q ../SterkeBeer-3Dprint.zip *.stl printset.png LEESMIJ-PRINTEN.md && cd .. && ls -la print SterkeBeer-3Dprint.zip
      - uses: actions/upload-artifact@v4
        with:
          name: print
          path: |
            SterkeBeer-3Dprint.zip
            print/printset.png

  # 2. De Android-app (APK)
  apk:
    needs: [modellen, print]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - uses: actions/download-artifact@v4
        with: { name: print, path: printart }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Android-onderdelen voor .NET
        run: dotnet workload install android
      - name: Spel in de app zetten
        run: rm -rf Assets && cp -r web Assets && rm -f Assets/dev-*.html
      # Vaste sleutel, zodat elke nieuwe APK over de vorige heen kan (zonder voortgang te verliezen)
      - name: Ondertekensleutel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Geheime sleutel als die is ingesteld, anders de sleutel uit de repo (signing/)
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/sterkebeer.keystore";
          else cp signing/sterkebeer.keystore "$RUNNER_TEMP/sterkebeer.keystore"; echo "KP_REPO=1" >> "$GITHUB_ENV"; fi
          echo "SIGN=1" >> "$GITHUB_ENV"
      - name: APK bouwen
        env:
          KP_SECRET: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ "$KP_REPO" = "1" ]; then export KP="ODOLeWJnPW3K6EkikS1Eq6pQHkeobmfv"; else export KP="$KP_SECRET"; fi
          CODE=$((100 + GITHUB_RUN_NUMBER))
          EXTRA=""
          if [ "$SIGN" = "1" ]; then EXTRA="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/sterkebeer.keystore -p:AndroidSigningKeyAlias=sterkebeer -p:AndroidSigningKeyPass=env:KP -p:AndroidSigningStorePass=env:KP"; fi
          dotnet publish SterkeBeer.csproj -f net10.0-android -c Release "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT" -p:ApplicationVersion=$CODE -p:ApplicationDisplayVersion=2.$GITHUB_RUN_NUMBER $EXTRA
      - name: APK klaarzetten
        run: |
          cp "$(ls bin/Release/net10.0-android/publish/*-Signed.apk | head -1)" SterkeBeer.apk && ls -la SterkeBeer.apk
          echo "{\"code\": $((100 + GITHUB_RUN_NUMBER)), \"name\": \"2.$GITHUB_RUN_NUMBER\", \"vast\": ${SIGN:-0}}" > versie.json && cat versie.json
      - uses: actions/upload-artifact@v4
        with: { name: SterkeBeer-apk, path: "SterkeBeer.apk\nversie.json" }
      - name: Release bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nieuwste -y --cleanup-tag || true
          {
            echo "**SterkeBeer.apk**: download op de tablet en open hem. Je voortgang blijft bewaard bij een update."
            echo ""
            echo "**SterkeBeer-3Dprint.zip**: het Beer-poppetje en alle superkracht-accessoires om te 3D-printen (STL). Lees LEESMIJ-PRINTEN.md in de zip."
            echo ""
            echo "Gebouwd vanaf ${GITHUB_SHA::7}."
          } > notes.md
          gh release create nieuwste SterkeBeer.apk printart/SterkeBeer-3Dprint.zip printart/print/printset.png --title "Sterke Beer: Moedeiland (nieuwste versie)" --latest --notes-file notes.md

  # 3. De web-app op GitHub Pages
  web:
    needs: [modellen, print, apk]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - uses: actions/download-artifact@v4
        with: { name: print, path: printart }
      - uses: actions/download-artifact@v4
        with: { name: SterkeBeer-apk, path: web/apk }
      - name: Printbestanden op de website
        run: mkdir -p web/print && cp printart/SterkeBeer-3Dprint.zip printart/print/printset.png web/print/ && ls -la web/apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
